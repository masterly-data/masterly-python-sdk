[project]
name = "masterly"
version = "0.3.0"
description = "Python client for Masterly — extract governed data products and ingest records from your lakehouse"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["mdm", "master data", "data products", "databricks", "fabric", "snowflake", "lakehouse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://masterlydata.com"
Documentation = "https://masterlydata.com/docs/reference/python-sdk/"
Repository = "https://github.com/masterly-data/masterly-python-sdk"
Changelog = "https://github.com/masterly-data/masterly-python-sdk/releases"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masterly"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106", "S311"]
# The demo data generator seeds a pseudo-random generator on purpose — reproducible fake
# data is the whole point, and none of it is a secret.
"examples/*" = ["S311"]
# The release-record check shells out to git. Every argument is a literal subcommand or a
# value read out of this repository's own tracked files, the list form never goes near a
# shell, and resolving git on PATH is the point — a hard-coded path would break the very
# CI runners the check exists to run on.
"scripts/*" = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

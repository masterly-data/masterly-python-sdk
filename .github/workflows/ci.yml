# Gates every pull request and every push to main. The package ships to PyPI from
# release.yml, which builds whatever is on the tag — so this is the only place the
# code is actually checked before it can get there.
#
# The floor is `requires-python` in pyproject: a client library is compiled by its
# consumers' interpreters, not ours, so the oldest supported one has to run the suite.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A re-push supersedes the run before it, so cancel the superseded PR run rather than pay
# for a result nobody will read. Guarded to pull_request: a push to main — a deploy on some
# repos, a tag build on others — must never be cancelled by whatever lands next. MAS-174.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the workflow grants nothing, and each job states the one scope it needs --
# reading the repository for actions/checkout. Nothing here writes through the token, and
# publishing lives in release.yml. Without a block the token's scopes are whatever the
# repository setting says, which is not something a reader of this file can see.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The ends of the supported range. The versions between them share a bytecode
        # generation with one of these two; widening the matrix buys little for the minutes.
        python: ["3.10", "3.13"]
    steps:
      # persist-credentials: false — actions/checkout otherwise leaves the job's
      # GITHUB_TOKEN in .git/config for the rest of the run, where any later step or
      # third-party action can read it. Nothing in this repo pushes from CI, so the
      # token has no job to do after the checkout. See masterly-framework
      # docs/conventions/github-repo-settings.md, "Checkout credentials".
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10, pinned by digest
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check
      # Strict, and on the package rather than the tests: a public client's types are
      # part of its contract.
      - run: uv run mypy src
      - run: uv run pytest -q

  # Every version on PyPI should be a tag here, and two are not: 0.1.1 and 0.2.0 were published
  # from the private repository this one replaced, and the archive-and-recreate did not carry
  # their tags across (MAS-503). RELEASING.md records what they were built from; this job keeps
  # that record honest, and stops the package version from being set to one of those spent
  # numbers. Its own job because it is standard-library only — no uv, no matrix, no network.
  release-record:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # persist-credentials: false — actions/checkout otherwise leaves the job's
      # GITHUB_TOKEN in .git/config for the rest of the run, where any later step or
      # third-party action can read it. Nothing in this repo pushes from CI, so the
      # token has no job to do after the checkout. See masterly-framework
      # docs/conventions/github-repo-settings.md, "Checkout credentials".
      #
      # fetch-depth: 0 — the check asks whether a commit is in this repository's history, and
      # in a shallow clone the answer is "no" for everything. It refuses to run shallow rather
      # than answer vacuously, so the full history is not optional here.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The detector before the thing it detects: synthetic records prove the check still
      # rejects a missing, malformed or stale one, so a check that has quietly stopped
      # checking fails here rather than passing the repository for the wrong reason.
      - run: python3 scripts/check_release_record.py --selftest
      - run: python3 scripts/check_release_record.py
